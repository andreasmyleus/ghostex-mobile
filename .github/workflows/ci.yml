name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: install, typecheck, export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Export iOS bundle
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo export --platform ios --output-dir dist-ios

      - name: Export Android bundle
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo export --platform android --output-dir dist-android
